[project]
name = "docs"
version = "0.1.0"
description = "Documentações e processos feitos do meu dia a dia"
readme = "README.md"
authors = [
    { name = "Pedro", email = "pedro.felipe11@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "myst-parser>=5.1.0",
    "sphinx>=9.1.0",
    "sphinx-book-theme>=1.4.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7.0",
]

[project.scripts]
docs = "docs:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
